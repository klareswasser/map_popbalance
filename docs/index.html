<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>国勢調査 メッシュ年齢分布クラスターマップ</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'SF Pro JP',
                   'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    #map { width: 100vw; height: 100vh; }

    /* ── iOS/macOS glass material (vibrant, readable) ── */
    .panel {
      background: rgba(252,252,252,0.88);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 0.5px solid rgba(255,255,255,0.7);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.5) inset,
        0 10px 32px rgba(0,0,0,0.10),
        0 2px 6px rgba(0,0,0,0.05);
      border-radius: 16px;
      animation: panelIn 0.45s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(-6px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (prefers-color-scheme: dark) {
      .panel {
        background: rgba(28,28,30,0.78);
        border-color: rgba(255,255,255,0.08);
        box-shadow:
          0 1px 0 rgba(255,255,255,0.06) inset,
          0 10px 32px rgba(0,0,0,0.4);
      }
    }

    /* ── Title ── */
    #title-box {
      position: absolute; top: 16px; left: 16px;
      padding: 12px 16px; z-index: 10;
      max-width: calc(100vw - 32px);
    }
    #title-box h2 {
      font-size: 15px; font-weight: 600; color: #1C1C1E;
      letter-spacing: -0.28px; line-height: 1.25;
    }
    #title-box p {
      font-size: 11.5px; color: rgba(60,60,67,0.62);
      margin-top: 4px; letter-spacing: -0.05px;
      font-feature-settings: "palt";
    }

    /* ── Search Panel ── */
    #search-panel {
      position: absolute; top: 16px; right: 16px;
      padding: 14px; width: 296px; z-index: 20;
    }
    #search-panel h2 {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.4px; color: rgba(60,60,67,0.5);
      margin-bottom: 10px; padding-left: 2px;
    }
    /* iOS search field */
    #search-row {
      display: flex; align-items: center;
      background: rgba(118,118,128,0.12);
      border-radius: 10px; padding: 0 4px 0 10px; gap: 6px;
      transition: background 0.18s, box-shadow 0.18s;
    }
    #search-row:focus-within {
      background: rgba(255,255,255,0.95);
      box-shadow: 0 0 0 3.5px rgba(0,122,255,0.25);
    }
    .search-icon {
      flex-shrink: 0; display: flex; align-items: center;
      color: rgba(60,60,67,0.45); pointer-events: none;
    }
    #address-input {
      flex: 1; padding: 9px 4px; border: none; background: transparent;
      color: #1C1C1E; font-size: 14px; font-family: inherit; outline: none;
      letter-spacing: -0.1px;
    }
    #address-input::placeholder { color: rgba(60,60,67,0.4); }
    #search-btn {
      flex-shrink: 0; margin: 4px;
      padding: 6px 14px; border-radius: 8px; border: none;
      background: #007AFF; color: #fff;
      font-size: 13px; font-weight: 600; font-family: inherit;
      cursor: pointer; white-space: nowrap; letter-spacing: -0.1px;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 1px 2px rgba(0,122,255,0.3);
    }
    #search-btn:hover  { background: #0071E3; box-shadow: 0 2px 8px rgba(0,122,255,0.35); }
    #search-btn:active { background: #005FBF; transform: scale(0.96); }
    #search-btn:disabled { background: rgba(0,122,255,0.35); cursor: default; box-shadow: none; }
    #result-box {
      margin-top: 12px; padding: 11px 13px;
      border-radius: 10px; font-size: 12px; display: none;
      animation: panelIn 0.3s cubic-bezier(0.22,1,0.36,1) both;
    }
    .result-name {
      font-size: 13px; font-weight: 600; margin-bottom: 4px;
      letter-spacing: -0.2px; display: flex; align-items: center; gap: 7px;
    }
    .result-detail { color: rgba(60,60,67,0.7); line-height: 1.65; }

    /* ── Legend ── */
    #legend {
      position: absolute; bottom: 40px; left: 16px;
      z-index: 10; overflow: hidden; min-width: 232px;
    }
    #legend-toggle {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px 12px 16px; cursor: pointer; user-select: none; gap: 10px;
      transition: background 0.15s;
    }
    #legend-toggle:hover { background: rgba(0,0,0,0.025); }
    #legend-toggle > span:first-child {
      font-size: 13px; font-weight: 600; color: #1C1C1E; letter-spacing: -0.2px;
    }
    #legend-chevron {
      width: 22px; height: 22px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: rgba(60,60,67,0.4); font-size: 10px;
      background: rgba(118,118,128,0.12); border-radius: 50%;
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    #legend.collapsed #legend-chevron { transform: rotate(-90deg); }
    #legend-body {
      padding: 6px 14px 12px;
      border-top: 0.5px solid rgba(60,60,67,0.1);
    }
    #legend.collapsed #legend-body { display: none; }
    .legend-item {
      display: flex; align-items: center;
      gap: 10px; padding: 5px 4px; border-radius: 6px;
      transition: background 0.12s;
    }
    .legend-item:hover { background: rgba(0,0,0,0.03); }
    .legend-dot {
      width: 11px; height: 11px; border-radius: 50%;
      flex-shrink: 0;
      box-shadow:
        0 0 0 0.5px rgba(0,0,0,0.08),
        0 1px 2px rgba(0,0,0,0.12);
    }
    .legend-name {
      font-size: 12.5px; font-weight: 500; color: #1C1C1E;
      letter-spacing: -0.1px; line-height: 1.3;
    }

    /* ── Info (hover) ── */
    #info {
      position: absolute; bottom: 40px; right: 16px;
      z-index: 10; max-width: 280px; display: none; padding: 14px 16px;
    }
    #info-title {
      font-size: 14px; font-weight: 600; color: #1C1C1E;
      margin-bottom: 6px; letter-spacing: -0.2px;
      display: flex; align-items: center; gap: 8px;
    }
    .info-dot {
      display: inline-block; width: 10px; height: 10px;
      border-radius: 50%; flex-shrink: 0;
      box-shadow:
        0 0 0 0.5px rgba(0,0,0,0.08),
        0 1px 2px rgba(0,0,0,0.12);
    }
    #info-body { font-size: 12px; color: rgba(60,60,67,0.68); line-height: 1.7; }

    /* ── Geolocate button (top-right, below search panel) ── */
    .maplibregl-ctrl-top-right {
      top: 130px !important;
      right: 16px !important;
    }
    .maplibregl-ctrl-group {
      background: rgba(252,252,252,0.88) !important;
      backdrop-filter: blur(30px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(30px) saturate(180%) !important;
      border: 0.5px solid rgba(255,255,255,0.7) !important;
      border-radius: 12px !important;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.5) inset,
        0 6px 20px rgba(0,0,0,0.10),
        0 2px 6px rgba(0,0,0,0.05) !important;
      overflow: hidden;
    }
    .maplibregl-ctrl-group button {
      width: 40px !important; height: 40px !important;
      background-color: transparent !important;
    }
    .maplibregl-ctrl-group button:hover { background-color: rgba(0,0,0,0.05) !important; }
    .maplibregl-ctrl-group button.maplibregl-ctrl-geolocate-active .maplibregl-ctrl-icon {
      filter: hue-rotate(-10deg) saturate(1.5);
    }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      #title-box { top: 12px; left: 12px; padding: 8px 12px; }
      #title-box h2 { font-size: 13px; }
      #title-box p  { display: none; }

      #legend { bottom: 92px; left: 12px; max-width: calc(100vw - 24px); }

      .maplibregl-ctrl-top-right { top: 56px !important; right: 12px !important; }

      #search-panel {
        top: auto; bottom: 0; right: 0; left: 0; width: 100%;
        border-radius: 22px 22px 0 0; border-bottom: none;
        padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
        box-shadow:
          0 -1px 0 rgba(255,255,255,0.5) inset,
          0 -8px 24px rgba(0,0,0,0.10);
      }
      #search-panel::before {
        content: ''; display: block;
        width: 36px; height: 5px; border-radius: 3px;
        background: rgba(60,60,67,0.2);
        margin: 0 auto 10px;
      }
      #search-panel h2 { display: none; }
      #address-input { font-size: 16px; }
      #search-btn { font-size: 15px; padding: 7px 14px; }

      #info { bottom: auto; top: 70px; right: 12px; left: 12px; max-width: none; }
    }
  </style>
</head>
<body>
<div id="map"></div>

<div id="title-box">
  <h2>国勢調査 年齢分布クラスターマップ</h2>
  <p>令和2年(2020) ・ 500mメッシュ ・ 全国</p>
</div>

<div id="search-panel">
  <h2>住所・地名で検索</h2>
  <div id="search-row">
    <input id="address-input" type="text" placeholder="例：渋谷区、札幌市北区" />
    <button id="search-btn">検索</button>
  </div>
  <div id="result-box"></div>
</div>

<div id="info">
  <h3 id="info-title"></h3>
  <div id="info-body"></div>
</div>

<div id="legend">
  <div id="legend-toggle">
    <span>クラスター凡例</span>
    <span id="legend-chevron">▾</span>
  </div>
  <div id="legend-body">
    <div class="legend-item"><div class="legend-dot" style="background:#ff9800"></div><span class="legend-name">学生街エリア</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#4caf50"></div><span class="legend-name">近年人気が高まる子育てエリア</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#bdbdbd"></div><span class="legend-name">多世代が住まう都市型エリア</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#1565c0"></div><span class="legend-name">高齢化が見え始めた郊外エリア</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#f44336"></div><span class="legend-name">準・限界住宅地エリア</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#795548"></div><span class="legend-name">限界住宅地エリア</span></div>
  </div>
</div>

<script>
// PMTiles プロトコルの登録
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', protocol.tile);

// PMTilesファイルのパス（絶対URLに変換）
const PMTILES_URL = 'pmtiles://' + new URL('cluster.pmtiles', window.location.href).href;

const CLUSTER_COLORS = [
  '#ff9800', // 0
  '#4caf50', // 1
  '#bdbdbd', // 2
  '#1565c0', // 3
  '#f44336', // 4
  '#795548', // 5
];

const colorExpr = [
  'match', ['get', 'cluster_id'],
  0, '#ff9800',
  1, '#4caf50',
  2, '#bdbdbd',
  3, '#1565c0',
  4, '#f44336',
  5, '#795548',
  '#aaaaaa'
];

const map = new maplibregl.Map({
  container: 'map',
  style: './pale.json',
  center: [137.0, 37.0],
  zoom: 5,
  maxZoom: 14,
});

// 現在地ボタン（右上）
map.addControl(
  new maplibregl.GeolocateControl({
    positionOptions: { enableHighAccuracy: true },
    trackUserLocation: false,
    showUserLocation: true,
    fitBoundsOptions: { maxZoom: 12 },
  }),
  'top-right'
);

map.on('load', () => {
  map.addSource('cluster', {
    type: 'vector',
    url: PMTILES_URL,
    attribution: '© 総務省 令和2年国勢調査',
  });

  map.addLayer({
    id: 'cluster-fill',
    type: 'fill',
    source: 'cluster',
    'source-layer': 'cluster',
    paint: {
      'fill-color': colorExpr,
      'fill-opacity': [
        'interpolate', ['linear'], ['zoom'],
        4, 0.5,
        10, 0.7,
        12, 0.85
      ],
    },
  });

  map.addLayer({
    id: 'cluster-outline',
    type: 'line',
    source: 'cluster',
    'source-layer': 'cluster',
    minzoom: 9,
    paint: {
      'line-color': '#ffffff',
      'line-width': 0.3,
      'line-opacity': 0.4,
    },
  });
});

// ホバー/クリックでポップアップ
const clusterNames = {
  0: "学生街エリア",
  1: "近年人気が高まる子育てエリア",
  2: "多世代が住まう都市型エリア",
  3: "高齢化が見え始めた郊外エリア",
  4: "準・限界住宅地エリア",
  5: "限界住宅地エリア",
};

map.on('mousemove', 'cluster-fill', (e) => {
  map.getCanvas().style.cursor = 'pointer';
  const props = e.features[0].properties;
  const cid = props.cluster_id;
  const infoEl = document.getElementById('info');
  const titleEl = document.getElementById('info-title');
  const bodyEl = document.getElementById('info-body');
  infoEl.style.display = 'block';
  titleEl.innerHTML = `<span class="info-dot" style="background:${CLUSTER_COLORS[cid] || '#aaa'}"></span>${clusterNames[cid] || 'Cluster ' + cid}`;
  let html = `人口: ${Number(props.pop_total).toLocaleString()} 人`;
  if (props.gini != null) html += `<br>ジニ係数(0-64歳): ${Number(props.gini).toFixed(3)}`;
  bodyEl.innerHTML = html;
});

map.on('mouseleave', 'cluster-fill', () => {
  map.getCanvas().style.cursor = '';
  document.getElementById('info').style.display = 'none';
});

// ── 住所検索 ──
let searchMarker = null;

async function searchAddress() {
  const q = document.getElementById('address-input').value.trim();
  if (!q) return;
  const btn = document.getElementById('search-btn');
  btn.textContent = '…';
  btn.disabled = true;

  try {
    const url = `https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(q)}`;
    const res = await fetch(url);
    const data = await res.json();
    if (!data.length) { showResult(null, '住所が見つかりませんでした'); return; }

    const [lon, lat] = data[0].geometry.coordinates;
    const displayName = data[0].properties.title;

    if (searchMarker) searchMarker.remove();
    searchMarker = new maplibregl.Marker({ color: '#3b82f6' })
      .setLngLat([lon, lat])
      .addTo(map);

    map.flyTo({ center: [lon, lat], zoom: 12, duration: 800 });

    map.once('moveend', () => {
      map.once('idle', () => {
        const pt = map.project([lon, lat]);
        const features = map.queryRenderedFeatures(pt, { layers: ['cluster-fill'] });
        if (features.length) {
          const props = features[0].properties;
          const cid = props.cluster_id;
          const color = CLUSTER_COLORS[cid] || '#333';
          const name = clusterNames[cid] || `Cluster ${cid}`;
          let detail = `人口: ${Number(props.pop_total).toLocaleString()} 人`;
          if (props.gini != null) detail += `<br>ジニ係数(0-64歳): ${Number(props.gini).toFixed(3)}`;
          showResult(color, `Cluster ${cid}: ${name}`, detail);
          if (searchMarker) { searchMarker.remove(); }
          searchMarker = new maplibregl.Marker({ color })
            .setLngLat([lon, lat])
            .addTo(map);
        } else {
          showResult(null, displayName, 'この地点のメッシュデータがありません（海上・国外など）');
        }
      });
    });
  } catch (e) {
    showResult(null, 'エラー', '検索に失敗しました');
  } finally {
    btn.textContent = '検索';
    btn.disabled = false;
  }
}

function showResult(color, name, detail) {
  const box = document.getElementById('result-box');
  box.style.display = 'block';
  box.style.background = color ? `${color}12` : 'rgba(118,118,128,0.06)';
  box.style.border = `0.5px solid ${color ? color + '55' : 'rgba(60,60,67,0.12)'}`;
  const dot = color ? `<span class="info-dot" style="background:${color}"></span>` : '';
  box.innerHTML = `<div class="result-name">${dot}<span style="color:${color || '#1C1C1E'}">${name}</span></div>`
    + (detail ? `<div class="result-detail">${detail}</div>` : '');
}

document.getElementById('search-btn').addEventListener('click', searchAddress);
document.getElementById('address-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') searchAddress();
});

// ── 凡例の折りたたみ ──
const legendEl = document.getElementById('legend');
const legendToggle = document.getElementById('legend-toggle');

// モバイルでは最初から閉じた状態
if (window.innerWidth <= 640) {
  legendEl.classList.add('collapsed');
}

legendToggle.addEventListener('click', () => {
  legendEl.classList.toggle('collapsed');
});
</script>
</body>
</html>
