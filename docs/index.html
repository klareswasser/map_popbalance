<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>国勢調査 メッシュ年齢分布クラスターマップ</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'SF Pro JP',
                   'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      color: #1C1C1E;
    }
    #map { width: 100vw; height: 100dvh; }

    /* Apple glass material */
    .panel {
      background: rgba(250,250,250,0.72);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 0.5px solid rgba(0,0,0,0.06);
      box-shadow:
        0 0 0 0.5px rgba(255,255,255,0.6) inset,
        0 8px 24px rgba(0,0,0,0.08),
        0 1px 3px rgba(0,0,0,0.04);
      border-radius: 14px;
      animation: panelIn 0.45s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(-6px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Header (top gradient, pointer-events:none) */
    #header {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      background: linear-gradient(to bottom, rgba(250,250,250,0.78), rgba(250,250,250,0));
      padding: max(16px, env(safe-area-inset-top)) 22px 36px;
      pointer-events: none;
    }
    #header h1 {
      font-size: 15px; font-weight: 600;
      letter-spacing: -0.32px; color: #1C1C1E;
    }
    #header p {
      font-size: 11px; color: rgba(60,60,67,0.6);
      margin-top: 3px; letter-spacing: -0.05px;
      font-variant-numeric: tabular-nums;
    }

    /* Legend */
    #legend {
      position: absolute; bottom: 24px; left: 14px;
      z-index: 10; overflow: hidden; min-width: 224px;
    }
    #legend-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 14px 9px; gap: 10px;
    }
    #legend-header h3 {
      font-size: 10.5px; font-weight: 600;
      letter-spacing: 0.5px; color: rgba(60,60,67,0.45);
      text-transform: uppercase;
    }
    #legend-close {
      display: none;
      background: rgba(118,118,128,0.12); border: none; cursor: pointer;
      width: 24px; height: 24px; border-radius: 50%;
      font-size: 11px; color: rgba(60,60,67,0.6);
      align-items: center; justify-content: center; line-height: 1;
      transition: background 0.15s;
    }
    #legend-body {
      padding: 4px 12px 12px;
    }
    .legend-item {
      display: flex; align-items: center;
      gap: 10px; padding: 4px 2px; border-radius: 6px;
    }
    .legend-dot {
      width: 10px; height: 10px; border-radius: 50%;
      flex-shrink: 0;
      box-shadow:
        0 0 0 0.5px rgba(0,0,0,0.08),
        0 1px 2px rgba(0,0,0,0.10);
    }
    .legend-name {
      font-size: 12px; font-weight: 500; color: #1C1C1E;
      letter-spacing: -0.1px; line-height: 1.3;
    }

    .info-dot {
      display: inline-block; width: 10px; height: 10px;
      border-radius: 50%; flex-shrink: 0;
      box-shadow:
        0 0 0 0.5px rgba(0,0,0,0.08),
        0 1px 2px rgba(0,0,0,0.12);
    }

    /* MapLibreコントロール（PC: 左上 = ヘッダーの下） */
    .maplibregl-ctrl-top-left { top: 64px !important; left: 14px !important; }
    .maplibregl-ctrl-group {
      background: rgba(250,250,250,0.72) !important;
      backdrop-filter: blur(40px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(40px) saturate(180%) !important;
      border: 0.5px solid rgba(0,0,0,0.06) !important;
      border-radius: 11px !important;
      box-shadow:
        0 0 0 0.5px rgba(255,255,255,0.6) inset,
        0 6px 20px rgba(0,0,0,0.08),
        0 1px 3px rgba(0,0,0,0.04) !important;
      overflow: hidden;
    }
    .maplibregl-ctrl-group button {
      width: 38px !important; height: 38px !important;
      background-color: transparent !important;
    }
    .maplibregl-ctrl-group button:hover { background-color: rgba(0,0,0,0.04) !important; }
    .maplibregl-ctrl-attrib {
      background: rgba(250,250,250,0.7) !important;
      backdrop-filter: blur(20px);
      font-size: 10px !important;
    }

    /* モバイル専用ボタン群はPCで非表示 */
    #legend-toggle, #geolocate-toggle { display: none; }

    /* Loading */
    #loading {
      position: absolute; inset: 0; z-index: 100;
      background: #f5f5f0;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px;
      transition: opacity 0.3s ease-out;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading p { font-size: 12.5px; color: rgba(60,60,67,0.6); letter-spacing: -0.1px; }
    .spinner {
      width: 32px; height: 32px;
      border: 2.5px solid rgba(0,0,0,0.08);
      border-top-color: #007AFF; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Mobile (≤640px) */
    @media (max-width: 640px) {
      #header { padding: max(10px, env(safe-area-inset-top)) 14px 24px; }
      #header h1 { font-size: 14px; }
      #header p  { display: none; }

      .maplibregl-ctrl-top-left, .maplibregl-ctrl-top-right {
        display: none !important;
      }

      #legend {
        display: none;
        top: max(56px, calc(env(safe-area-inset-top) + 46px));
        right: 14px; left: auto; bottom: auto;
        max-width: calc(100vw - 28px);
      }
      #legend.open { display: block; z-index: 30; }
      #legend-close { display: flex; }
      #legend-close:active { background: rgba(118,118,128,0.2); }

      #legend-toggle {
        display: flex; align-items: center;
        position: absolute;
        top: max(12px, calc(env(safe-area-inset-top) + 2px));
        right: 14px; z-index: 20;
        padding: 8px 14px; border: none;
        font-size: 12.5px; font-weight: 600; color: #1C1C1E;
        cursor: pointer; letter-spacing: -0.1px;
      }
      #geolocate-toggle {
        display: flex; align-items: center; justify-content: center;
        position: absolute;
        top: max(54px, calc(env(safe-area-inset-top) + 44px));
        right: 14px; z-index: 20;
        width: 38px; height: 38px;
        border: none; padding: 0;
        cursor: pointer;
        border-radius: 11px;
        color: rgba(60,60,67,0.7);
      }
      #geolocate-toggle.active { color: #007AFF; }
      #legend-toggle:active, #geolocate-toggle:active { transform: scale(0.93); }
    }

    @media (max-width: 900px) and (orientation: landscape) {
      #header { display: none; }
    }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>地図を読み込んでいます…</p>
</div>

<div id="map"></div>

<div id="header">
  <h1>年齢分布クラスターマップ</h1>
  <p>令和2年(2020) ・ 500mメッシュ ・ 全国</p>
</div>

<div id="legend" class="panel">
  <div id="legend-header">
    <h3>クラスター凡例</h3>
    <button id="legend-close" aria-label="閉じる">✕</button>
  </div>
  <div id="legend-body">
    <div class="legend-item"><div class="legend-dot" style="background:#ff9800"></div><span class="legend-name">学生街エリア</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#4caf50"></div><span class="legend-name">近年人気が高まる子育てエリア</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#bdbdbd"></div><span class="legend-name">多世代が住まう都市型エリア</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#1565c0"></div><span class="legend-name">高齢化が見え始めた郊外エリア</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#f44336"></div><span class="legend-name">準・限界住宅地エリア</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#795548"></div><span class="legend-name">限界住宅地エリア</span></div>
  </div>
</div>

<button id="legend-toggle" class="panel">凡例</button>
<button id="geolocate-toggle" class="panel" aria-label="現在地">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="17" height="17" fill="currentColor">
    <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
  </svg>
</button>

<script>
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', protocol.tile);

const PMTILES_URL = 'pmtiles://' + new URL('cluster.pmtiles', window.location.href).href;

const CLUSTER_COLORS = ['#ff9800','#4caf50','#bdbdbd','#1565c0','#f44336','#795548'];
const CLUSTER_NAMES = {
  0: "学生街エリア",
  1: "近年人気が高まる子育てエリア",
  2: "多世代が住まう都市型エリア",
  3: "高齢化が見え始めた郊外エリア",
  4: "準・限界住宅地エリア",
  5: "限界住宅地エリア",
};
const colorExpr = [
  'match', ['get', 'cluster_id'],
  0, '#ff9800', 1, '#4caf50', 2, '#bdbdbd',
  3, '#1565c0', 4, '#f44336', 5, '#795548',
  '#aaaaaa'
];

const map = new maplibregl.Map({
  container: 'map',
  style: './pale.json',
  center: [137.0, 37.0],
  zoom: 5,
  maxZoom: 14,
  hash: true,
});

const geolocate = new maplibregl.GeolocateControl({
  positionOptions: { enableHighAccuracy: true },
  trackUserLocation: false,
  showUserLocation: true,
  fitBoundsOptions: { maxZoom: 12 },
});
map.addControl(geolocate, 'top-left');

map.on('load', () => {
  document.getElementById('loading').classList.add('hidden');
  setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 300);

  map.addSource('cluster', {
    type: 'vector',
    url: PMTILES_URL,
    attribution: '© 総務省 令和2年国勢調査',
  });

  map.addLayer({
    id: 'cluster-fill',
    type: 'fill',
    source: 'cluster',
    'source-layer': 'cluster',
    paint: {
      'fill-color': colorExpr,
      'fill-opacity': [
        'interpolate', ['linear'], ['zoom'],
        4, 0.5, 10, 0.7, 12, 0.85
      ],
    },
  });

  map.addLayer({
    id: 'cluster-outline',
    type: 'line',
    source: 'cluster',
    'source-layer': 'cluster',
    minzoom: 9,
    paint: { 'line-color': '#fff', 'line-width': 0.3, 'line-opacity': 0.4 },
  });
});

const popup = new maplibregl.Popup({ closeButton: true, closeOnClick: false, offset: 8 });
let pinned = false;
popup.on('close', () => { pinned = false; });

function makePopupHTML(props) {
  const cid = props.cluster_id;
  const color = CLUSTER_COLORS[cid] || '#888';
  const name = CLUSTER_NAMES[cid] || `Cluster ${cid}`;
  const pop = props.pop_total != null ? Number(props.pop_total).toLocaleString() : '—';
  return `<div style="font-size:12.5px;line-height:1.55;min-width:180px;font-family:inherit;letter-spacing:-0.1px">
    <div style="font-weight:600;color:${color};margin-bottom:5px;display:flex;align-items:center;gap:7px;font-size:13px">
      <span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${color};box-shadow:0 0 0 0.5px rgba(0,0,0,0.08)"></span>${name}
    </div>
    <div style="color:rgba(60,60,67,0.7)">人口 <b style="color:#1C1C1E;margin-left:6px">${pop}</b> 人</div>
  </div>`;
}

map.on('click', (e) => {
  if (!map.queryRenderedFeatures(e.point, { layers: ['cluster-fill'] }).length) {
    popup.remove();
  }
});

map.on('mousemove', 'cluster-fill', (e) => {
  map.getCanvas().style.cursor = 'pointer';
  if (!pinned) popup.setLngLat(e.lngLat).setHTML(makePopupHTML(e.features[0].properties)).addTo(map);
});
map.on('mouseleave', 'cluster-fill', () => {
  map.getCanvas().style.cursor = '';
  if (!pinned) popup.remove();
});

map.on('click', 'cluster-fill', (e) => {
  pinned = true;
  popup.setLngLat(e.lngLat).setHTML(makePopupHTML(e.features[0].properties)).addTo(map);
});

const legendEl = document.getElementById('legend');
const legendToggle = document.getElementById('legend-toggle');
const legendClose = document.getElementById('legend-close');

legendToggle.addEventListener('click', () => {
  const isOpen = legendEl.classList.toggle('open');
  legendToggle.textContent = isOpen ? '✕ 閉じる' : '凡例';
});
legendClose.addEventListener('click', () => {
  legendEl.classList.remove('open');
  legendToggle.textContent = '凡例';
});

document.getElementById('geolocate-toggle').addEventListener('click', () => {
  geolocate.trigger();
});
geolocate.on('geolocate', () => {
  document.getElementById('geolocate-toggle').classList.add('active');
});
geolocate.on('error', () => {
  document.getElementById('geolocate-toggle').classList.remove('active');
});
</script>
</body>
</html>
