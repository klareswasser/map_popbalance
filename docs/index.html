<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>国勢調査 メッシュ年齢分布クラスターマップ</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'SF Pro JP',
                   'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      color: #1C1C1E;
    }
    #map { width: 100vw; height: 100dvh; }

    /* Apple glass material */
    .panel {
      background: rgba(252,252,252,0.88);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 0.5px solid rgba(255,255,255,0.7);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.5) inset,
        0 10px 32px rgba(0,0,0,0.10),
        0 2px 6px rgba(0,0,0,0.05);
      border-radius: 16px;
      animation: panelIn 0.4s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(-6px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Header (top gradient, pointer-events:none) */
    #header {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      background: linear-gradient(to bottom, rgba(252,252,252,0.85), rgba(252,252,252,0));
      padding: max(14px, env(safe-area-inset-top)) 20px 32px;
      pointer-events: none;
    }
    #header h1 {
      font-size: 16px; font-weight: 600;
      letter-spacing: -0.3px; color: #1C1C1E;
    }
    #header p {
      font-size: 11.5px; color: rgba(60,60,67,0.62);
      margin-top: 3px; letter-spacing: -0.05px;
    }

    /* Search panel */
    #search-panel {
      position: absolute; top: 16px; right: 16px;
      padding: 14px; width: 296px; z-index: 20;
    }
    #search-panel h2 {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.4px; color: rgba(60,60,67,0.5);
      margin-bottom: 10px; padding-left: 2px;
    }
    #search-row {
      display: flex; align-items: center;
      background: rgba(118,118,128,0.12);
      border-radius: 10px; padding: 0 4px 0 10px; gap: 6px;
      transition: background 0.18s, box-shadow 0.18s;
    }
    #search-row:focus-within {
      background: rgba(255,255,255,0.95);
      box-shadow: 0 0 0 3.5px rgba(0,122,255,0.25);
    }
    .search-icon {
      flex-shrink: 0; display: flex; align-items: center;
      color: rgba(60,60,67,0.45); pointer-events: none;
    }
    #address-input {
      flex: 1; padding: 9px 4px; border: none; background: transparent;
      color: #1C1C1E; font-size: 14px; font-family: inherit; outline: none;
      letter-spacing: -0.1px;
    }
    #address-input::placeholder { color: rgba(60,60,67,0.4); }
    #search-btn {
      flex-shrink: 0; margin: 4px;
      padding: 6px 14px; border-radius: 8px; border: none;
      background: #007AFF; color: #fff;
      font-size: 13px; font-weight: 600; font-family: inherit;
      cursor: pointer; white-space: nowrap; letter-spacing: -0.1px;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 1px 2px rgba(0,122,255,0.3);
    }
    #search-btn:hover  { background: #0071E3; }
    #search-btn:active { background: #005FBF; transform: scale(0.96); }
    #search-btn:disabled { background: rgba(0,122,255,0.35); cursor: default; }
    #result-box {
      margin-top: 12px; padding: 11px 13px;
      border-radius: 10px; font-size: 12px; display: none;
      animation: panelIn 0.3s cubic-bezier(0.22,1,0.36,1) both;
    }
    .result-name {
      font-size: 13px; font-weight: 600; margin-bottom: 4px;
      letter-spacing: -0.2px; display: flex; align-items: center; gap: 7px;
    }
    .result-detail { color: rgba(60,60,67,0.7); line-height: 1.65; }

    /* Legend */
    #legend {
      position: absolute; bottom: 40px; left: 16px;
      z-index: 10; overflow: hidden; min-width: 232px;
    }
    #legend-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px 12px 16px; gap: 10px;
    }
    #legend-header h3 {
      font-size: 13px; font-weight: 600; color: #1C1C1E; letter-spacing: -0.2px;
    }
    #legend-close {
      display: none;
      background: rgba(118,118,128,0.12); border: none; cursor: pointer;
      width: 22px; height: 22px; border-radius: 50%;
      font-size: 11px; color: rgba(60,60,67,0.6);
      align-items: center; justify-content: center; line-height: 1;
    }
    #legend-body {
      padding: 4px 14px 12px;
      border-top: 0.5px solid rgba(60,60,67,0.1);
    }
    .legend-item {
      display: flex; align-items: center;
      gap: 10px; padding: 5px 4px; border-radius: 6px;
    }
    .legend-dot {
      width: 11px; height: 11px; border-radius: 50%;
      flex-shrink: 0;
      box-shadow:
        0 0 0 0.5px rgba(0,0,0,0.08),
        0 1px 2px rgba(0,0,0,0.12);
    }
    .legend-name {
      font-size: 12.5px; font-weight: 500; color: #1C1C1E;
      letter-spacing: -0.1px; line-height: 1.3;
    }

    /* Info popup (PCホバー) */
    #info {
      position: absolute; bottom: 40px; right: 16px;
      z-index: 10; max-width: 280px; display: none; padding: 14px 16px;
    }
    #info-title {
      font-size: 14px; font-weight: 600; color: #1C1C1E;
      margin-bottom: 6px; letter-spacing: -0.2px;
      display: flex; align-items: center; gap: 8px;
    }
    .info-dot {
      display: inline-block; width: 10px; height: 10px;
      border-radius: 50%; flex-shrink: 0;
      box-shadow:
        0 0 0 0.5px rgba(0,0,0,0.08),
        0 1px 2px rgba(0,0,0,0.12);
    }
    #info-body { font-size: 12px; color: rgba(60,60,67,0.68); line-height: 1.7; }

    /* MapLibreコントロール（PC: 左上 = ヘッダーの下） */
    .maplibregl-ctrl-top-left { top: 70px !important; left: 16px !important; }
    .maplibregl-ctrl-group {
      background: rgba(252,252,252,0.88) !important;
      backdrop-filter: blur(30px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(30px) saturate(180%) !important;
      border: 0.5px solid rgba(255,255,255,0.7) !important;
      border-radius: 12px !important;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.5) inset,
        0 6px 20px rgba(0,0,0,0.10) !important;
      overflow: hidden;
    }
    .maplibregl-ctrl-group button {
      width: 40px !important; height: 40px !important;
      background-color: transparent !important;
    }
    .maplibregl-ctrl-group button:hover { background-color: rgba(0,0,0,0.05) !important; }
    .maplibregl-ctrl-attrib {
      background: rgba(252,252,252,0.78) !important;
      backdrop-filter: blur(20px);
      font-size: 10px !important;
    }

    /* モバイル専用ボタン群はPCで非表示 */
    #legend-toggle, #geolocate-toggle { display: none; }

    /* Loading */
    #loading {
      position: absolute; inset: 0; z-index: 100;
      background: #f5f5f0;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px;
      transition: opacity 0.3s ease-out;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading p { font-size: 12.5px; color: rgba(60,60,67,0.6); letter-spacing: -0.1px; }
    .spinner {
      width: 32px; height: 32px;
      border: 2.5px solid rgba(0,0,0,0.08);
      border-top-color: #007AFF; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Mobile (≤640px) */
    @media (max-width: 640px) {
      #header { padding: max(10px, env(safe-area-inset-top)) 14px 24px; }
      #header h1 { font-size: 14px; }
      #header p  { display: none; }

      .maplibregl-ctrl-top-left, .maplibregl-ctrl-top-right {
        display: none !important;
      }

      #search-panel {
        top: auto; bottom: 0; right: 0; left: 0; width: 100%;
        border-radius: 22px 22px 0 0;
        padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
        box-shadow:
          0 -1px 0 rgba(255,255,255,0.5) inset,
          0 -8px 24px rgba(0,0,0,0.10);
      }
      #search-panel::before {
        content: ''; display: block;
        width: 36px; height: 5px; border-radius: 3px;
        background: rgba(60,60,67,0.2);
        margin: 0 auto 10px;
      }
      #search-panel h2 { display: none; }
      #address-input { font-size: 16px; padding: 11px 4px; }
      #search-btn { font-size: 15px; padding: 8px 14px; }
      #result-box { max-height: 110px; overflow-y: auto; }

      #legend {
        display: none;
        top: max(56px, calc(env(safe-area-inset-top) + 46px));
        right: 14px; left: auto; bottom: auto;
        max-width: calc(100vw - 28px);
      }
      #legend.open { display: block; z-index: 30; }
      #legend-close { display: flex; }

      #legend-toggle {
        display: flex; align-items: center;
        position: absolute;
        top: max(12px, calc(env(safe-area-inset-top) + 2px));
        right: 14px; z-index: 20;
        padding: 8px 14px; border: none;
        font-size: 12.5px; font-weight: 600; color: #1C1C1E;
        cursor: pointer; letter-spacing: -0.1px;
      }
      #geolocate-toggle {
        display: flex; align-items: center; justify-content: center;
        position: absolute;
        top: max(54px, calc(env(safe-area-inset-top) + 44px));
        right: 14px; z-index: 20;
        width: 38px; height: 38px;
        border: none; padding: 0;
        font-size: 16px; cursor: pointer;
        border-radius: 50%;
      }
      #geolocate-toggle.active { color: #007AFF; }

      #info { display: none !important; }
    }

    @media (max-width: 900px) and (orientation: landscape) {
      #header { display: none; }
    }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>地図を読み込んでいます…</p>
</div>

<div id="map"></div>

<div id="header">
  <h1>年齢分布クラスターマップ</h1>
  <p>令和2年(2020) ・ 500mメッシュ ・ 全国</p>
</div>

<div id="search-panel" class="panel">
  <h2>住所・地名で検索</h2>
  <div id="search-row">
    <span class="search-icon">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
      </svg>
    </span>
    <input id="address-input" type="text" placeholder="例：渋谷区、札幌市北区" />
    <button id="search-btn">検索</button>
  </div>
  <div id="result-box"></div>
</div>

<div id="info" class="panel">
  <h3 id="info-title"></h3>
  <div id="info-body"></div>
</div>

<div id="legend" class="panel">
  <div id="legend-header">
    <h3>クラスター凡例</h3>
    <button id="legend-close" aria-label="閉じる">✕</button>
  </div>
  <div id="legend-body">
    <div class="legend-item"><div class="legend-dot" style="background:#ff9800"></div><span class="legend-name">学生街エリア</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#4caf50"></div><span class="legend-name">近年人気が高まる子育てエリア</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#bdbdbd"></div><span class="legend-name">多世代が住まう都市型エリア</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#1565c0"></div><span class="legend-name">高齢化が見え始めた郊外エリア</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#f44336"></div><span class="legend-name">準・限界住宅地エリア</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#795548"></div><span class="legend-name">限界住宅地エリア</span></div>
  </div>
</div>

<button id="legend-toggle" class="panel">凡例</button>
<button id="geolocate-toggle" class="panel" aria-label="現在地">📍</button>

<script>
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', protocol.tile);

const PMTILES_URL = 'pmtiles://' + new URL('cluster.pmtiles', window.location.href).href;

const CLUSTER_COLORS = ['#ff9800','#4caf50','#bdbdbd','#1565c0','#f44336','#795548'];
const CLUSTER_NAMES = {
  0: "学生街エリア",
  1: "近年人気が高まる子育てエリア",
  2: "多世代が住まう都市型エリア",
  3: "高齢化が見え始めた郊外エリア",
  4: "準・限界住宅地エリア",
  5: "限界住宅地エリア",
};
const colorExpr = [
  'match', ['get', 'cluster_id'],
  0, '#ff9800', 1, '#4caf50', 2, '#bdbdbd',
  3, '#1565c0', 4, '#f44336', 5, '#795548',
  '#aaaaaa'
];

const map = new maplibregl.Map({
  container: 'map',
  style: './pale.json',
  center: [137.0, 37.0],
  zoom: 5,
  maxZoom: 14,
  hash: true,
});

map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-left');
const geolocate = new maplibregl.GeolocateControl({
  positionOptions: { enableHighAccuracy: true },
  trackUserLocation: false,
  showUserLocation: true,
  fitBoundsOptions: { maxZoom: 12 },
});
map.addControl(geolocate, 'top-left');
map.addControl(new maplibregl.ScaleControl({ maxWidth: 100, unit: 'metric' }), 'bottom-left');

map.on('load', () => {
  document.getElementById('loading').classList.add('hidden');
  setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 300);

  map.addSource('cluster', {
    type: 'vector',
    url: PMTILES_URL,
    attribution: '© 総務省 令和2年国勢調査',
  });

  map.addLayer({
    id: 'cluster-fill',
    type: 'fill',
    source: 'cluster',
    'source-layer': 'cluster',
    paint: {
      'fill-color': colorExpr,
      'fill-opacity': [
        'interpolate', ['linear'], ['zoom'],
        4, 0.5, 10, 0.7, 12, 0.85
      ],
    },
  });

  map.addLayer({
    id: 'cluster-outline',
    type: 'line',
    source: 'cluster',
    'source-layer': 'cluster',
    minzoom: 9,
    paint: { 'line-color': '#fff', 'line-width': 0.3, 'line-opacity': 0.4 },
  });
});

const popup = new maplibregl.Popup({ closeButton: true, closeOnClick: false, offset: 8 });
let pinned = false;
popup.on('close', () => { pinned = false; });

function makePopupHTML(props) {
  const cid = props.cluster_id;
  const color = CLUSTER_COLORS[cid] || '#888';
  const name = CLUSTER_NAMES[cid] || `Cluster ${cid}`;
  const pop = props.pop_total != null ? Number(props.pop_total).toLocaleString() : '—';
  const gini = props.gini != null ? Number(props.gini).toFixed(3) : '—';
  return `<div style="font-size:12px;line-height:1.6;min-width:180px;font-family:inherit">
    <div style="font-weight:600;color:${color};margin-bottom:4px;display:flex;align-items:center;gap:6px">
      <span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${color}"></span>${name}
    </div>
    <div style="color:rgba(60,60,67,0.7)">人口: <b style="color:#1C1C1E">${pop}人</b></div>
    <div style="color:rgba(60,60,67,0.7)">ジニ係数(0-64歳): <b style="color:#1C1C1E">${gini}</b></div>
  </div>`;
}

map.on('click', (e) => {
  if (!map.queryRenderedFeatures(e.point, { layers: ['cluster-fill'] }).length) {
    popup.remove();
  }
});

map.on('mousemove', 'cluster-fill', (e) => {
  map.getCanvas().style.cursor = 'pointer';
  const props = e.features[0].properties;
  if (window.innerWidth > 640) {
    const cid = props.cluster_id;
    const infoEl = document.getElementById('info');
    infoEl.style.display = 'block';
    document.getElementById('info-title').innerHTML =
      `<span class="info-dot" style="background:${CLUSTER_COLORS[cid] || '#888'}"></span>${CLUSTER_NAMES[cid] || 'Cluster ' + cid}`;
    let html = `人口: ${Number(props.pop_total || 0).toLocaleString()} 人`;
    if (props.gini != null) html += `<br>ジニ係数(0-64歳): ${Number(props.gini).toFixed(3)}`;
    document.getElementById('info-body').innerHTML = html;
  }
  if (!pinned) popup.setLngLat(e.lngLat).setHTML(makePopupHTML(props)).addTo(map);
});
map.on('mouseleave', 'cluster-fill', () => {
  map.getCanvas().style.cursor = '';
  document.getElementById('info').style.display = 'none';
  if (!pinned) popup.remove();
});

map.on('click', 'cluster-fill', (e) => {
  pinned = true;
  popup.setLngLat(e.lngLat).setHTML(makePopupHTML(e.features[0].properties)).addTo(map);
});

let searchMarker = null;

async function searchAddress() {
  const q = document.getElementById('address-input').value.trim();
  if (!q) return;
  const btn = document.getElementById('search-btn');
  btn.textContent = '…';
  btn.disabled = true;

  try {
    const url = `https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(q)}`;
    const res = await fetch(url);
    const data = await res.json();
    if (!data.length) { showResult(null, null, '住所が見つかりませんでした'); return; }

    const [lon, lat] = data[0].geometry.coordinates;
    const displayName = data[0].properties.title;

    if (searchMarker) searchMarker.remove();
    searchMarker = new maplibregl.Marker({ color: '#007AFF' })
      .setLngLat([lon, lat]).addTo(map);

    map.flyTo({ center: [lon, lat], zoom: 12, duration: 800 });

    map.once('moveend', () => {
      map.once('idle', () => {
        const pt = map.project([lon, lat]);
        const features = map.queryRenderedFeatures(pt, { layers: ['cluster-fill'] });
        if (features.length) {
          const props = features[0].properties;
          const cid = props.cluster_id;
          const color = CLUSTER_COLORS[cid] || '#333';
          const name = CLUSTER_NAMES[cid] || `Cluster ${cid}`;
          let detail = `人口: ${Number(props.pop_total || 0).toLocaleString()} 人`;
          if (props.gini != null) detail += `<br>ジニ係数(0-64歳): ${Number(props.gini).toFixed(3)}`;
          showResult(color, name, detail);
          if (searchMarker) searchMarker.remove();
          searchMarker = new maplibregl.Marker({ color }).setLngLat([lon, lat]).addTo(map);
        } else {
          showResult(null, displayName.split(',')[0], 'この地点のメッシュデータがありません');
        }
      });
    });
  } catch (e) {
    showResult(null, 'エラー', '検索に失敗しました');
  } finally {
    btn.textContent = '検索';
    btn.disabled = false;
  }
}

function showResult(color, name, detail) {
  const box = document.getElementById('result-box');
  box.style.display = 'block';
  box.style.background = color ? `${color}12` : 'rgba(118,118,128,0.06)';
  box.style.border = `0.5px solid ${color ? color + '55' : 'rgba(60,60,67,0.12)'}`;
  const dot = color ? `<span class="info-dot" style="background:${color}"></span>` : '';
  box.innerHTML = (name ? `<div class="result-name">${dot}<span style="color:${color || '#1C1C1E'}">${name}</span></div>` : '')
    + (detail ? `<div class="result-detail">${detail}</div>` : '');
}

document.getElementById('search-btn').addEventListener('click', searchAddress);
document.getElementById('address-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') searchAddress();
});

const legendEl = document.getElementById('legend');
const legendToggle = document.getElementById('legend-toggle');
const legendClose = document.getElementById('legend-close');

legendToggle.addEventListener('click', () => {
  const isOpen = legendEl.classList.toggle('open');
  legendToggle.textContent = isOpen ? '✕ 閉じる' : '凡例';
});
legendClose.addEventListener('click', () => {
  legendEl.classList.remove('open');
  legendToggle.textContent = '凡例';
});

document.getElementById('geolocate-toggle').addEventListener('click', () => {
  geolocate.trigger();
});
geolocate.on('geolocate', () => {
  document.getElementById('geolocate-toggle').classList.add('active');
});
geolocate.on('error', () => {
  document.getElementById('geolocate-toggle').classList.remove('active');
});
</script>
</body>
</html>
